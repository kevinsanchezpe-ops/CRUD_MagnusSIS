{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3f91">
  <title>{% block title %}Inventario · Magnus SIS{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'productos/tailwind.generated.css' %}">
  <link rel="stylesheet" href="{% static 'productos/mockups-inventario.css' %}">
  <script src="{% static 'productos/app.js' %}" defer></script>
</head>
<body class="app-page">
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <div class="app">
    <aside class="sidebar" aria-label="Barra lateral">
      <a class="side-brand" href="{% url 'productos:lista' %}">
        <img src="{% static 'branding/logo.png' %}" alt="">
        <span><b>Magnus SIS</b><small>INVENTARIO</small></span>
      </a>
      <nav class="primary-nav" aria-label="Navegación principal">
        <a class="nav-item {% if request.path == '/' %}active{% endif %}" href="{% url 'productos:lista' %}" {% if request.path == '/' %}aria-current="page"{% endif %}><span class="nav-text">Productos</span></a>
        <a class="nav-item {% if request.path == '/categorias/' %}active{% endif %}" href="{% url 'productos:categorias' %}" {% if request.path == '/categorias/' %}aria-current="page"{% endif %}><span class="nav-text">Categorías</span></a>
        <a class="nav-item admin-nav-item" href="{% url 'admin:index' %}"><span class="nav-text">Administración Django</span></a>
      </nav>
      <p class="side-foot">Prototipo sin conexión al backend</p>
    </aside>
    <div class="main">
      <div class="topbar"><span class="system-status">Datos guardados en este navegador</span></div>
      <main class="content" id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
