{% extends 'productos/base.html' %}
{% block title %}Categorías · Magnus SIS{% endblock %}
{% block content %}
<div class="crumb">Inicio&nbsp; / &nbsp;Categorías</div>
<div class="heading"><div><h1>Categorías</h1><p>Organiza los productos por tipo para encontrarlos fácilmente.</p></div><button class="btn primary" id="new-category" type="button">Nueva categoría</button></div>
<div class="toolbar category-toolbar"><div class="filter-search"><label for="category-search">Buscar categorías</label><span class="search"><input id="category-search" type="search" placeholder="Nombre o descripción"><button class="search-submit" id="category-search-submit" type="button">Buscar</button></span></div><button class="btn secondary sort-button" id="sort-categories" type="button" aria-label="Ordenar categorías de A a Z">Ordenar: A–Z</button></div>
<section class="category-grid" id="category-grid" aria-label="Categorías de productos"></section>
<div class="empty-state card" id="category-empty" role="status" aria-live="polite"><h2>Aún no hay categorías</h2><p>Crea una categoría para clasificar tus productos.</p><button class="btn primary" id="empty-new-category" type="button">Nueva categoría</button></div>
{% endblock %}
